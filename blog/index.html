<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blog — Nandish Jha</title>
<meta name="description" content="Stories, tech notes, and project logs from Nandish Jha." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/blog.css" />
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="shell">
  <header class="blog-nav">
    <a class="mark" href="../">NJ</a>
    <div class="links">
      <a class="home-link" href="../">Portfolio</a>
      <a href="admin.html" class="admin-link">Admin</a>
    </div>
  </header>

  <section class="hero">
    <p class="eyebrow">Field notes</p>
    <h1>Blog</h1>
    <p>Stories, thoughts on new tech, and project logs — shipping, building, and what’s next.</p>
  </section>

  <div class="filters" id="filters" role="tablist" aria-label="Filter posts">
    <button type="button" class="filter-btn is-active" data-filter="all">All</button>
    <button type="button" class="filter-btn" data-filter="story">Stories</button>
    <button type="button" class="filter-btn" data-filter="tech">Tech</button>
    <button type="button" class="filter-btn" data-filter="project">Projects</button>
  </div>

  <div class="post-list" id="postList" aria-live="polite"></div>
</div>
<script type="module" src="js/index.js"></script>
</body>
</html>
